spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # In production the schema is fixed; only validate that entities match it.
      ddl-auto: validate
    show-sql: false

# In production, all secrets MUST come from the environment. No defaults.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.studentbuddy: INFO
    org.springframework.security: WARN
